; DualPath-RDMA 客户端配置示例
;
; path0 是"控制通道"，承载握手信息，其余 path 都只传数据。
; local_ip  = 本机哪张网卡出去（决定走哪条物理链路）
; remote_ip = 对端（server）在这张网卡对应网段上的地址
; port      = 这条 path 使用的端口，要跟 server 配置里同一个 path 的 port 一致
; weight    = 相对权重，两张网卡带宽不一样时可以调这个比例（比如 25G:10G 就填 2.5 和 1）

[general]
transport=tcp        ; tcp | rdma
chunk_size=1048576   ; 单片大小，字节，默认 1MiB
window=8             ; 每条路径的滑动窗口大小（在途未 ACK 分片数上限）

[path0]
local_ip=192.168.10.1
remote_ip=192.168.10.2
port=18801
weight=1.0

[path1]
local_ip=192.168.20.1
remote_ip=192.168.20.2
port=18802
weight=1.0
