; DualPath-RDMA 服务端配置示例
;
; 服务端视角：local_ip 填"本机"各网卡地址（要监听哪几个地址），
; remote_ip 在服务端这一侧目前没有被使用（只是留作文档说明预期是谁连进来），
; port 要跟 client 配置里对应 path 的 port 一致。
;
; 注意：client 和 server 是两份不同的配置文件（各自站在自己的视角写 local_ip），
; 不要直接把同一份 config.ini 同时给 client 和 server 用（除非是本机 loopback 演示）。

[general]
transport=tcp
chunk_size=1048576
window=8

[path0]
local_ip=192.168.10.2
remote_ip=192.168.10.1
port=18801
weight=1.0

[path1]
local_ip=192.168.20.2
remote_ip=192.168.20.1
port=18802
weight=1.0
