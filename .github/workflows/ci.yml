name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install RDMA build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libibverbs-dev librdmacm-dev
      - name: Build
        run: make
      - name: Unit tests
        run: make test
      - name: CRC32C benchmark smoke test
        run: make bench
